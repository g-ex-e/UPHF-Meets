<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPHF Meets</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <div id="logo-animation">
        <div id="first-logo-container">
            <img src="logo.gif?v=3" alt="Loading...">
        </div>
        <div id="second-logo-container" style="display: none;">
            <img id="intro-text-gif" data-src="texte.gif?v=3" alt="Loading...">
        </div>
    </div>

    <div id="user-info-form" style="display: none;">
        <div class="welcome-card">
            <div class="welcome-brand">
                <img src="logo_uphf.png?v=3" class="welcome-logo" alt="Université Polytechnique Hauts-de-France">
            </div>
            <div class="welcome-copy">
                <h1>Bienvenue sur UPHF Meets</h1>
                <p>Entrez votre nom pour commencer une rencontre.</p>
            </div>
            <div class="welcome-input">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5.33 0-8 2.67-8 5v2h16v-2c0-2.33-2.67-5-8-5Z"/></svg>
                <input type="text" id="user-name" maxlength="40" autocomplete="name" placeholder="Nom et prénom">
            </div>
            <button type="button" id="submit-name">
                <span>Commencer</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13.17 5.59 1.42-1.42L22.41 12l-7.82 7.83-1.42-1.42L18.59 13H2v-2h16.59l-5.42-5.41Z"/></svg>
            </button>
            <div class="welcome-divider"><span>ou</span></div>
            <button type="button" id="login-cas" class="secondary-button">Se connecter avec l'ENT</button>
            <p id="welcome-hint" aria-live="polite"></p>
        </div>
    </div>

    <main id="rest-of-site" style="display:none;">
        <section id="call-area">
            <div id="videos">
                <article class="video-panel remote-panel">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-topbar">
                        <div class="video-person">
                            <span class="video-role">Correspondant</span>
                            <strong id="peer-name-span">En attente</strong>
                        </div>
                        <button id="fullscreen-remote" class="round-control" type="button" title="Plein écran" aria-label="Plein écran de la vidéo distante">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5h2V5h3V3Zm13 5V3h-5v2h3v3h2ZM5 16H3v5h5v-2H5v-3Zm16 0h-2v3h-3v2h5v-5Z"/></svg>
                        </button>
                    </div>
                    <div id="remote-empty-state" class="remote-empty-state">
                        <div class="empty-pulse"></div>
                        <span>En attente d'une rencontre</span>
                    </div>
                </article>

                <article class="video-panel local-panel">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-topbar">
                        <div class="video-person">
                            <span class="video-role">Vous</span>
                            <strong id="local-user-name">Local</strong>
                        </div>
                    </div>
                    <div class="media-controls">
                        <button id="toggle-mic" class="round-control" type="button" title="Couper le micro" aria-label="Couper le micro">
                            <svg class="mic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21H8v2h8v-2h-3v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
                            <svg class="mic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 11-2 0a5 5 0 0 1-.31 1.73l1.54 1.54A7 7 0 0 0 19 11Zm-4 .17V5a3 3 0 0 0-5.94-.6L15 10.34v.83ZM4.27 3 3 4.27l6.02 6.02V11a3 3 0 0 0 4.17 2.76l1.11 1.11A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.92V21H8v2h8v-2h-3v-3.08a6.96 6.96 0 0 0 2.77-1.03L19.73 21 21 19.73 4.27 3Z"/></svg>
                        </button>
                        <button id="toggle-camera" class="round-control" type="button" title="Couper la caméra" aria-label="Couper la caméra">
                            <svg class="camera-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h11a2 2 0 0 1 2 2v2.5l4-3V17l-4-3v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v10h11V7H4Z"/></svg>
                            <svg class="camera-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3.27 2 18.46 18.46-1.27 1.27L17 18.27V19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 .27-.99L2 5.73 3.27 4.46 19.54 20.73 3.27 4.46V2ZM17 9.5l4-3V17l-4-3v.73l-2-2V7H9.27l-2-2H15a2 2 0 0 1 2 2v2.5Z"/></svg>
                        </button>
                    </div>
                </article>
            </div>

            <div class="match-bar">
                <div id="connection-status" class="status-pill status-idle" aria-live="polite">
                    <span class="status-dot"></span>
                    <span id="connection-status-text">Prêt</span>
                </div>
                <button id="search" type="button"><span id="search-label">Lancer la recherche</span></button>
            </div>
        </section>

        <section id="chat-container">
            <div class="chat-toolbar">
                <strong>Discussion</strong>
                <div id="chat-controls">
                    <button id="share-screen" class="tool-button" type="button" title="Partager l'écran">
                        <img src="partage.png?v=3" alt="">
                        <span>Écran</span>
                    </button>
                    <button id="transfer-file" class="tool-button" type="button" title="Envoyer un fichier">
                        <img src="fichier.png?v=3" alt="">
                        <span>Fichier</span>
                    </button>
                    <input type="file" id="file-input" hidden>
                </div>
            </div>

            <div id="messages" aria-live="polite">
                <div id="chat-placeholder" class="chat-placeholder">Vos messages apparaîtront ici.</div>
            </div>

            <div id="transfer-progress" class="transfer-progress" hidden>
                <span id="transfer-progress-label">Transfert...</span>
                <div class="progress-track"><div id="transfer-progress-bar"></div></div>
                <span id="transfer-progress-percent">0%</span>
            </div>

            <div class="chat-composer">
                <input type="text" id="chat-message" maxlength="1000" autocomplete="off" placeholder="Tapez un message...">
                <button id="send-message" type="button" title="Envoyer" aria-label="Envoyer le message">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21.85 12 3.4 3.6 3 10.13 14 12 3 13.87l.4 6.53Z"/></svg>
                </button>
            </div>
        </section>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="script.js?v=6"></script>
</body>
</html>
